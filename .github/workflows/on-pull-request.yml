name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install golangci-lint
        run: |
          if [ ! -f ~/.local/bin/golangci-lint ]; then
            mkdir -p ~/.local/bin
            version=${GOLANGCI_LINT_VERSION#v}
            name=golangci-lint-${version}-linux-amd64
            base=https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}
            cd "$(mktemp -d)"
            curl -sSfLO "${base}/${name}.tar.gz"
            curl -sSfLO "${base}/golangci-lint-${version}-checksums.txt"
            # install.sh matches the .sbom.json line in the checksums file too and fails
            grep "  ${name}.tar.gz\$" "golangci-lint-${version}-checksums.txt" | sha256sum -c -
            tar -xzf "${name}.tar.gz"
            install "${name}/golangci-lint" ~/.local/bin/golangci-lint
          fi
          echo ~/.local/bin >> $GITHUB_PATH

      - name: Run CI
        run: make ci
