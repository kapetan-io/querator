# This is an example config file

# Querator currently supports "memory", "badger", "postgres", and "mongo" storage drivers.
# Each storage entry selects its backend by nesting the backend's options under a section named
# after the backend (memory, badger, mongo). Exactly one backend section may be set per entry, and
# unknown options are rejected at startup rather than silently ignored.

# HTTP server listen address (use 0.0.0.0 for Docker)
address: 0.0.0.0:2319

logging:
  # The logging handler; options are 'color', 'text', 'json'
  handler: text
  # The logging level; options are 'info', 'warn', 'error', 'debug',
  level: info

# Queue Storage defines where metadata about the queues is stored
queue-storage:
  badger:
    storage-dir: /data/queues

# Partition Storage defines where partitions are stored. Each backend's affinity is its share of a
# queue's partitions, so 1.5 gets three times the partitions of 0.5. Fractions are accepted. A backend
# with affinity 0 gets none of the partitions Querator places itself. A negative affinity fails start.
# Querator saves each backend's affinity in queue storage the first time it sees the backend. After
# that the saved value is the one in force, and changing it here does nothing. Change it with
# `querator backends update <name> --affinity <n>` (`/v1/storage/backends.update`).
partition-storage:
  - name: badger-01
    affinity: 1
    badger:
      storage-dir: /data/partitions

  # The in-memory backend has no options; select it with an empty mapping.
  #  - name: mem-01
  #    affinity: 1
  #    memory: {}

# PostgreSQL partition storage.
#  - name: postgres-01
#    affinity: 1
#    postgres:
#      connection-string: "postgres://user:pass@localhost:5432/querator"
#      # Caps the pgx connection pool per client; omit for the driver default.
#      max-conns: 50
#      # Rows the lifecycle reads per page, at most 1000; omit to use the default (1000).
#      scan-batch-size: 1000

# MongoDB partition storage. Non-transactional and standalone-compatible: a single mongod (no replica
# set) is sufficient. See docs/storage/mongodb.md
#  - name: mongo-01
#    affinity: 1
#    mongo:
#      connection-string: "mongodb://user:pass@localhost:27017"
#      database: querator
#      # Caps the driver connection pool per client; omit for the driver default.
#      max-pool-size: 50

# MongoDB may also back queue metadata. When queue and partition storage share a connection string
# they share one driver client, so set max-pool-size consistently in both places.
# queue-storage:
#   mongo:
#     connection-string: "mongodb://user:pass@localhost:27017"
#     database: querator
#     max-pool-size: 50

# PostgreSQL may also back queue metadata. When queue and partition storage share a connection string
# they share one pgx pool, so set max-conns consistently in both places.
# queue-storage:
#   postgres:
#     connection-string: "postgres://user:pass@localhost:5432/querator"
#     max-conns: 50
#     scan-batch-size: 1000

# Auth turns on API keys. Without this section every request is allowed and any
# Authorization header is ignored, which suits deployments behind a trusted network.
# With it, requests send their key as "Authorization: Bearer <key>". An "auth:" line
# with nothing under it refuses to start.
#
# storage holds namespaces, users, roles, role bindings and API keys, and takes
# memory or badger. With memory, all of them are lost on restart, while queues kept
# in a badger queue-storage survive and are left without their namespace.
# /v1/queues.create refuses a namespace that does not exist, so create it first
# with /v1/namespaces.create.
#
# See docs/operating-limits.md for Open Door: requests without a key get admin
# access, and the door reopens at every start.
#auth:
#  storage:
#    badger:
#      storage-dir: /data/auth

