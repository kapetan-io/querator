# MongoDB partition storage. Non-transactional and standalone-compatible: a single mongod (no replica
# set) is sufficient. See docs/storage/mongodb.md and docs/adr/0026-mongodb-backend-consistency-model.md
#  - name: mongo-01
#    driver: mongo
#    affinity: 1
#
#    config:
#      connection-string: "mongodb://user:pass@localhost:27017"
#      database: querator
#      # Caps the driver connection pool per client; omit for the driver default.
#      max-pool-size: "50"

# MongoDB may also back queue metadata. When queue and partition storage share a connection string
# they share one driver client, so set max-pool-size consistently in both places.
# queue-storage:
#   driver: mongo
#   config:
#     connection-string: "mongodb://user:pass@localhost:27017"
#     database: querator
#     max-pool-size: "50"

# Auth Backend defines the authentication and authorization backend.
# Options:
#   "none" (default) - No authentication; all requests are allowed (open access).
#                      Suitable for internal deployments behind a trusted network.
#   "internal"       - Uses the configured storage backends (users, api-keys, roles,
#                      role-bindings) for authentication and RBAC authorization.
#auth-backend:
#  driver: internal

