syntax = "proto3";

option go_package = "github.com/kapetan-io/querator/proto";
import "google/protobuf/timestamp.proto";
import "proto/queue.proto";

package querator;

message QueuesListRequest {
  // Pivot is the name of the queue to pivot upon when paging through lists of queues
  string pivot  = 2;
  // Limit is the maximum number of items to return in a single list response
  int32 limit = 3;
  // Namespace filters the list to only include queues in the specified namespace.
  // If empty, lists queues in the default namespace.
  string namespace = 4;
}

message QueuesListResponse {
  repeated QueueInfo items = 1;
}

message QueuesDeleteRequest {
  // QueueName is the name of the queue to delete
  string queueName = 1 [json_name = "queue_name"];
  // Force indicates the deletion should ignore any current open lease or items in the queue and
  // delete all data related to the queue. In addition, this forcibly cancels all in progress client
  // lease requests.
  bool force = 2;
}

message QueuesInfoRequest {
  // The name of the queue to retrieve information about
  string queueName = 1 [json_name = "queue_name"];
}

// QueuesUpdateRequest changes the settings of an existing queue. A setting the request leaves
// out, or sends as JSON `null`, keeps its current value. `dead_queue`, `reference` and
// `max_attempts` can be cleared by sending them explicitly: `"dead_queue": ""` removes the dead letter queue, `"reference": ""`
// removes the reference and `"max_attempts": 0` allows unlimited attempts.
//
// Its field numbers match QueueInfo, so a QueueInfo sent here decodes. Binary protobuf never
// writes an empty string or a 0 for a QueueInfo field, so a client sending QueueInfo that way
// cannot clear these three settings.
message QueuesUpdateRequest {
  // The name of the queue to update
  string queueName = 1 [json_name = "queue_name"];

  // The name of the dead letter queue for this queue. Left out, the current dead letter queue
  // is kept. An empty string removes it.
  optional string deadQueue = 4 [json_name = "dead_queue"];

  // A user supplied field which could contain metadata or specify who owns this queue.
  // Left out, the current reference is kept. An empty string removes it.
  optional string reference = 5;

  // The lease timeout for this queue. Left out, empty or '0s', the current lease timeout is kept.
  // Example: '60m', '24h', '10s'
  string leaseTimeout = 6 [json_name = "lease_timeout"];

  // How long the item can wait in the queue regardless of attempts before it is moved
  // to the dead letter queue. Left out, empty or '0s', the current expire timeout is kept.
  // Example: '24h', '60m', '10s'
  string expireTimeout = 7 [json_name = "expire_timeout"];

  // The maximum number of times an item can be retried by a consumer before it is placed in
  // the dead letter queue or removed. Left out, the current limit is kept. '0' allows
  // unlimited attempts.
  optional int32 maxAttempts = 8 [json_name = "max_attempts"];

  // The number of partitions the queue is requesting. Left out or '0', the current count is kept.
  // Above 1024 is rejected and nothing is saved.
  int32 requestedPartitions = 9 [json_name = "requested_partitions"];

  // The fields below are accepted so a JSON body copied from '/queues.info' is not refused as
  // having unknown fields. All four are ignored on update, but a malformed namespace is refused.
  google.protobuf.Timestamp createdAt = 2 [json_name = "created_at"];
  google.protobuf.Timestamp updatedAt = 3 [json_name = "updated_at"];
  repeated PartitionInfo partitions = 10;
  string namespace = 11;
}
