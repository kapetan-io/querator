syntax = "proto3";

option go_package = "github.com/kapetan-io/querator/proto";
import "google/protobuf/timestamp.proto";

package querator;

message StorageItemsListRequest {
  string queueName = 1 [json_name = "queue_name"];
  int32 partition = 2;
  string pivot  = 3;
  int32 limit = 4;
}

message StorageItemsListResponse {
  repeated StorageItem items = 1;
}

message StorageItemsImportRequest {
  string queueName = 1 [json_name = "queue_name"];
  int32 partition = 2;
  repeated StorageItem items = 3;
}

message StorageItemsImportResponse {
  repeated StorageItem items = 2;
}

message StorageItemsDeleteRequest {
  string queueName = 1 [json_name = "queue_name"];
  int32 partition = 2;
  repeated string ids = 3;
}

// StorageItem maps directly to the internal.types.Item and allows users to inspect items in storage
message StorageItem {
  string id = 1;
  string source_id = 2 [json_name = "source_id"];
  bool isLeased = 3  [json_name = "is_leased"];
  google.protobuf.Timestamp leaseDeadline = 4 [json_name = "lease_deadline"];
  google.protobuf.Timestamp expireDeadline = 5 [json_name = "expire_deadline"];
  google.protobuf.Timestamp deadDeadline = 6 [json_name = "dead_deadline"];
  google.protobuf.Timestamp createdAt = 7 [json_name = "created_at"];
  google.protobuf.Timestamp updatedAt = 8 [json_name = "updated_at"];
  google.protobuf.Timestamp enqueueAt = 9 [json_name = "enqueue_at"];
  int32 attempts = 10;
  int32 maxAttempts = 11 [json_name = "max_attempts"];
  string reference = 12;
  string encoding = 13;
  string kind = 14;
  bytes payload = 15;
}

message StorageBackendsUpdateRequest {
  // The storage backend's name.
  string backend = 1;
  // How large a part of every queue's partitions the backend holds. Zero means none.
  // Left out, the saved affinity is kept.
  optional double affinity = 2;
}

message StorageBackendsListRequest {
}

message StorageBackendsListResponse {
  // One entry per storage backend with a saved record, and one per storage backend that holds
  // a partition and has no saved record (an entry with no affinity).
  repeated StorageBackend backends = 1;
}

message StorageBackend {
  // The storage backend's name.
  string backend = 1;
  // The saved affinity. Left out when the backend has no saved record.
  optional double affinity = 2;
  // False when the backend is not in this instance's config file.
  optional bool configured = 3;
  reserved 4;
  reserved "safeToStop";
  // Every partition on the backend.
  repeated BackendPartition partitions = 5;
  // What a rebalance would do to this backend right now.
  PendingRebalance pending = 6;
}

message BackendPartition {
  // The queue the partition belongs to.
  string queueName = 1 [json_name = "queue_name"];
  // The partition number.
  optional int32 partition = 2;
  // Either 'available' or 'draining'.
  string state = 3;
  // Items waiting to be leased. Left out when Querator cannot read the partition.
  optional int32 unleased = 4;
  // Items leased and not yet completed. Left out when Querator cannot read the partition.
  optional int32 leased = 5;
  // Items scheduled and not yet due. Left out when Querator cannot read the partition.
  optional int32 scheduled = 6;
  // The same meaning as `failures` in '/queue.stats'. Above 0 means the partition is failing.
  // 1 when Querator could not load the queue or read its counts.
  optional int32 failures = 7;
}

message PendingRebalance {
  // Partitions a rebalance would create on this backend.
  repeated QueuePartitions create = 1;
  // Partitions on this backend a rebalance would mark draining.
  repeated QueuePartitions drain = 2;
}

message QueuePartitions {
  string queueName = 1 [json_name = "queue_name"];
  repeated int32 partitions = 2;
}
